name: Build Cloner APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (full log captured)
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-full.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Upload APK
        if: env.GRADLE_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cloner-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Save log to buildlog folder
        if: always()
        run: |
          mkdir -p buildlog
          TS=$(date +"%Y-%m-%d_%H-%M-%S")
          if [ "$GRADLE_EXIT" = "0" ]; then RESULT="SUCCESS"; else RESULT="FAILED"; fi
          LOGFILE="buildlog/build_${TS}_run-${{ github.run_number }}_${RESULT}.txt"
          {
            echo "Build log - run #${{ github.run_number }}"
            echo "Date (UTC): $(date)"
            echo "Commit: ${{ github.sha }}"
            echo "Result: $RESULT"
            echo "----------------------------------------"
            cat build-full.log 2>/dev/null || echo "(no build log was produced)"
          } > "$LOGFILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add buildlog/
          git commit -m "Build log: run #${{ github.run_number }} ($RESULT)" || echo "Nothing to commit"
          git push

      - name: Fail the run if the build failed
        if: always()
        run: |
          if [ "${GRADLE_EXIT:-1}" != "0" ]; then
            echo "Build failed - see the log in the buildlog folder."
            exit 1
          fi
