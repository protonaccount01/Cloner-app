name: Thanos Snap (wipe repo)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SNAP to confirm wiping everything except .git'
        required: true
        type: string

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Safety check
        run: |
          if [ "${{ inputs.confirm }}" != "SNAP" ]; then
            echo "Aborted: you must type SNAP to confirm."
            exit 1
          fi

      - name: Delete everything except .git
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Thanos snap: repo wiped"
          git push
